name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The ADR check compares a pull request against its base (HEAD^1).
          fetch-depth: 2

      - name: ADR check
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            bash scripts/adr.sh --base HEAD^1
          else
            bash scripts/adr.sh
          fi

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      # Same Dockerfile as local development: identical PHP version and extensions.
      - name: Build image, install dependencies
        run: just setup

      - name: Format, lint, analyse and test
        run: just check
